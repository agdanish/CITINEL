# CITINEL on Render -- multi-service Blueprint (Best Use of Render).
#
# The "Best Use of Render" criterion is "deploy on Render" + "use more than one
# Render service". This Blueprint defines four resources, every one of which
# the codebase actually uses:
#
#   citinel-web       the glass-box console + read API (serves dashboard/static)
#   citinel-pipeline  background worker: the detection pipeline
#   citinel-n8n       self-hosted n8n, so the deployed app has a reachable
#                     webhook target (also the Best-Use-of-n8n integration)
#   citinel-postgres  managed PostgreSQL
#
# An earlier version of this file also claimed a "managed Key Value / Redis
# (enrichment cache + dedup)" service. That was never true: nothing in the
# codebase connects to Redis and the enrichment cache is disk-backed. It also
# broke the deploy, since Render permits one free Key Value per workspace and
# the failure cancelled every other resource in the sync. Removed rather than
# demoted -- infrastructure this project does not use should not appear in a
# Blueprint that argues for how well it uses infrastructure.
#
# Render auto-injects RENDER_EXTERNAL_URL; the demo QR code points at the web
# service's public URL. citinel-web runs on a paid plan precisely so it never
# cold-starts (see its own note below).
#
# Secrets (Anthropic/Tavily/VirusTotal/AbuseIPDB keys) are set in the Render
# dashboard as environment variables, never committed. sync:false marks them as
# dashboard-managed so the Blueprint never carries a value.

services:
  # --- web: glass-box dashboard + API ---------------------------------------
  # Plan note: `starter`, not `free`. Free web services spin down after 15
  # minutes idle and cold-start in 30-60s -- unacceptable for the surface the
  # deck's QR code points at, where a judge scanning it gets one impression.
  # The original design paid for a keep-warm cron to poke a free service;
  # Render rejects `plan: free` for cron too, so that cost the same money to
  # get a worse result. Paying it here instead means the service simply never
  # sleeps, and the cron is gone.
  - type: web
    name: citinel-web
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.web
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: CITINEL_ROLE
        value: web
      - key: CITINEL_SIMULATED_ENDPOINTS_ONLY
        value: "true"
      - key: CITINEL_DEFAULT_AUTONOMY
        value: shadow
      # Off by default, deliberately: the worker auto-running the swarm on
      # every CAUGHT incident risks silently re-billing already-investigated
      # incidents on a rebuild (see worker/run.py's own comment). Opt in only
      # once that's understood. Declared on both services for config
      # completeness even though only the worker actually reads it.
      - key: CITINEL_AUTO_SWARM
        value: "false"
      - key: CITINEL_AUTO_SWARM_MAX_PER_CYCLE
        value: "3"
      - key: CITINEL_ANTHROPIC_API_KEY
        sync: false
      # Only needed for an identity-linked API key (confirmed live, 1 Sep
      # 2026: such a key is rejected with 400 unless every request names the
      # workspace it acts in). Find it at platform.claude.com -> Settings ->
      # Workspaces. Leave blank for a classic key; the header is only sent
      # when this is set.
      - key: CITINEL_ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: CITINEL_TAVILY_API_KEY
        sync: false
      - key: CITINEL_VIRUSTOTAL_API_KEY
        sync: false
      - key: CITINEL_ABUSEIPDB_API_KEY
        sync: false
      # Model ids are chosen deliberately and verified live against
      # GET /v1/models before use (ledger rule L9) -- never defaulted in code,
      # so they must be set here or the swarm refuses to start.
      - key: CITINEL_TRIAGE_MODEL
        sync: false
      - key: CITINEL_REASONING_MODEL
        sync: false
      # Sponsor integrations. Every one degrades gracefully when unset
      # (connector reports not_configured), so leaving them blank is safe --
      # but they are declared here so Render prompts for them rather than
      # leaving an operator to discover the names from source.
      - key: CITINEL_N8N_WEBHOOK_URL
        sync: false
      - key: CITINEL_SWYTCHCODE_API_KEY
        sync: false
      - key: CITINEL_LYZR_API_KEY
        sync: false
      - key: CITINEL_LYZR_GUARD_URL
        sync: false
      - key: CITINEL_LYZR_AGENT_ID
        sync: false
      - key: CITINEL_LYZR_TRIAGE_AGENT_ID
        sync: false
      - key: CITINEL_LYZR_REVIEW_AGENT_ID
        sync: false
      - key: CITINEL_LYZR_HANDOVER_AGENT_ID
        sync: false
      - key: CITINEL_DATABASE_URL
        fromDatabase:
          name: citinel-postgres
          property: connectionString

  # --- worker: the detection + agent pipeline -------------------------------
  - type: worker
    name: citinel-pipeline
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.worker
    # Render does not offer a free instance type for background workers (free
    # tier covers web services and static sites only). "free" here would fail
    # Blueprint validation at launch -- found by the Best-Use-of-Render
    # adversarial audit. Starter is the cheapest plan that actually exists for
    # a worker service.
    plan: starter
    envVars:
      - key: CITINEL_ROLE
        value: worker
      - key: CITINEL_SIMULATED_ENDPOINTS_ONLY
        value: "true"
      # Was missing entirely on this service (coherence-audit finding, fixed
      # here rather than left as a note) -- the worker is the service that
      # actually executes autonomy-gated actions, so relying on the
      # in-code default matching by coincidence was the wrong call.
      - key: CITINEL_DEFAULT_AUTONOMY
        value: shadow
      - key: CITINEL_AUTO_SWARM
        value: "false"
      - key: CITINEL_AUTO_SWARM_MAX_PER_CYCLE
        value: "3"
      - key: CITINEL_ANTHROPIC_API_KEY
        sync: false
      - key: CITINEL_ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: CITINEL_TAVILY_API_KEY
        sync: false
      - key: CITINEL_VIRUSTOTAL_API_KEY
        sync: false
      - key: CITINEL_ABUSEIPDB_API_KEY
        sync: false
      # Model ids are chosen deliberately and verified live against
      # GET /v1/models before use (ledger rule L9) -- never defaulted in code,
      # so they must be set here or the swarm refuses to start.
      - key: CITINEL_TRIAGE_MODEL
        sync: false
      - key: CITINEL_REASONING_MODEL
        sync: false
      # Sponsor integrations. Every one degrades gracefully when unset
      # (connector reports not_configured), so leaving them blank is safe --
      # but they are declared here so Render prompts for them rather than
      # leaving an operator to discover the names from source.
      - key: CITINEL_N8N_WEBHOOK_URL
        sync: false
      - key: CITINEL_SWYTCHCODE_API_KEY
        sync: false
      - key: CITINEL_LYZR_API_KEY
        sync: false
      - key: CITINEL_LYZR_GUARD_URL
        sync: false
      - key: CITINEL_LYZR_AGENT_ID
        sync: false
      - key: CITINEL_LYZR_TRIAGE_AGENT_ID
        sync: false
      - key: CITINEL_LYZR_REVIEW_AGENT_ID
        sync: false
      - key: CITINEL_LYZR_HANDOVER_AGENT_ID
        sync: false
      - key: CITINEL_DATABASE_URL
        fromDatabase:
          name: citinel-postgres
          property: connectionString

  # (Removed: citinel-redis. Nothing in the codebase connects to Redis --
  # it appears in no setting in config.py, no module imports it, and the
  # enrichment cache is disk-backed (connectors/base.py EnrichmentCache).
  # The worker's own docstring says Redis-backed queueing is "tracked
  # separately rather than half-built here". Provisioning it anyway hit
  # Render's one-free-Key-Value-per-workspace limit and cancelled the whole
  # sync, so an unused dependency was blocking the services that are real.
  # Restore it in the same commit that actually uses it.)

  # --- n8n: the visible post-signoff automation (Best Use of n8n) -----------
  # Self-hosted on Render rather than n8n Cloud, for one decisive reason: a
  # laptop-local n8n sits at localhost:5678, and citinel-web (running on
  # Render) cannot POST a webhook to localhost. Hosting n8n here gives it a
  # public URL the deployed service can actually reach -- and it adds a fifth
  # service to this Blueprint, so it strengthens the Render criterion
  # ("use more than one Render service") at the same time.
  #
  # Plan note: `standard`, not `starter` or `free`. Free web services cannot
  # attach a persistent disk (Render docs, verified), and without one every
  # restart wipes the Beat 5b workflow -- unacceptable for the one live demo.
  # Starter's 512MB RAM turned out to be a second, harder blocker: n8n's own
  # startup (license SDK, package loading, DB init) reliably hits Node's heap
  # ceiling on 512MB and OOM-crashes in a loop -- confirmed directly from
  # Render's logs ("JavaScript heap out of memory"), not inferred. Standard's
  # 2GB is what n8n's own docs recommend as a minimum. ~$25/mo against the
  # $50 hackathon credit, prorated for the days remaining -- a few dollars,
  # not a real budget risk.
  - type: web
    name: citinel-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: standard
    # No healthCheckPath, deliberately. Render falls back to checking that the
    # service is listening on its port, which is what we actually care about.
    # Naming a path here would be a guess at n8n's internal routes, and a
    # wrong guess is not a soft failure: Render marks the service unhealthy
    # and restart-loops it. A port check cannot be wrong in that way.
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n     # n8n's own state dir: workflows + creds
      sizeGB: 1
    envVars:
      # Render assigns the port via $PORT (10000 for Docker/image services)
      # and health-checks THAT port. n8n binds N8N_PORT, whose own default is
      # 5678 -- so leaving it at 5678 means n8n listens on one port while
      # Render probes another, the check never passes, and the deploy is
      # marked failed even though the container started cleanly. Pinning both
      # sides to 10000 removes the mismatch.
      - key: N8N_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      # URL-generation only (how n8n writes its webhook URLs). It does not
      # make n8n terminate TLS itself -- Render's proxy does that in front.
      - key: N8N_PROTOCOL
        value: https
      # Render terminates TLS upstream, so n8n sees plain HTTP and would
      # otherwise refuse to set secure cookies, breaking the editor login.
      - key: N8N_SECURE_COOKIE
        value: "false"
      # Encrypts stored credentials at rest. Render generates it once and
      # keeps it stable across deploys -- regenerating it would orphan every
      # credential already saved in the workflow.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      # WEBHOOK_URL is deliberately NOT set here, and this is the one manual
      # step in the whole Blueprint.
      #
      # n8n needs its own full public origin -- scheme included --  to print
      # webhook URLs that CITINEL can actually POST to. Render's
      # `fromService: property: host` yields a bare hostname
      # ("citinel-n8n.onrender.com"), with no https:// on the front, so wiring
      # it here would hand n8n a value that looks plausible and silently
      # produces unreachable webhook URLs. Composing scheme + host is not
      # something the Blueprint syntax can do.
      #
      # So: after the first deploy, set it once in the Render dashboard
      #     citinel-n8n -> Environment -> Add
      #     WEBHOOK_URL = https://citinel-n8n.onrender.com
      # (use the service's real URL from the dashboard header). Render
      # redeploys automatically and the value persists across future deploys.
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata

  # (Removed: the citinel-keepwarm cron. It existed only to poll a free web
  # service so it would not cold-start. Render rejects `plan: free` for cron
  # services, so keeping it meant paying for a cron to compensate for a free
  # web service -- the same spend as simply running the web service on a plan
  # that never sleeps, but with a 10-minute window where it still could.
  # citinel.deploy.keepwarm remains in the source tree, unused, in case a
  # future free-tier deployment wants it.)

databases:
  # --- managed postgres: incidents, audit ledger, verdicts ------------------
  - name: citinel-postgres
    plan: free
    databaseName: citinel
    ipAllowList: []          # reachable only from other Render services
