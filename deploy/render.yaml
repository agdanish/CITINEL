# CITINEL on Render -- multi-service Blueprint (Best Use of Render).
#
# The "Best Use of Render" criterion is "deploy on Render" + "use more than one
# Render service". This Blueprint defines FOUR service types, which is the full
# runtime architecture from deck slide 8, not a minimal two-service token
# gesture: a web service (the glass-box UI + API), a background worker (the
# detection/agent pipeline), managed PostgreSQL (incidents, audit ledger,
# verdicts), and managed Key Value / Redis (enrichment cache + dedup).
#
# Render auto-injects RENDER_EXTERNAL_URL; the demo QR code points at the web
# service's public URL. Free-tier web services cold-start after 15 min idle, so
# a cron pre-warms it before judging (see the keep-warm cron below).
#
# Secrets (Anthropic/Tavily/VirusTotal/AbuseIPDB keys) are set in the Render
# dashboard as environment variables, never committed. sync:false marks them as
# dashboard-managed so the Blueprint never carries a value.

services:
  # --- web: glass-box dashboard + API ---------------------------------------
  - type: web
    name: citinel-web
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.web
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CITINEL_ROLE
        value: web
      - key: CITINEL_SIMULATED_ENDPOINTS_ONLY
        value: "true"
      - key: CITINEL_DEFAULT_AUTONOMY
        value: shadow
      - key: CITINEL_ANTHROPIC_API_KEY
        sync: false
      - key: CITINEL_TAVILY_API_KEY
        sync: false
      - key: CITINEL_VIRUSTOTAL_API_KEY
        sync: false
      - key: CITINEL_ABUSEIPDB_API_KEY
        sync: false
      - key: CITINEL_DATABASE_URL
        fromDatabase:
          name: citinel-postgres
          property: connectionString
      - key: CITINEL_REDIS_URL
        fromService:
          name: citinel-redis
          type: keyvalue
          property: connectionString

  # --- worker: the detection + agent pipeline -------------------------------
  - type: worker
    name: citinel-pipeline
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.worker
    # Render does not offer a free instance type for background workers (free
    # tier covers web services and static sites only). "free" here would fail
    # Blueprint validation at launch -- found by the Best-Use-of-Render
    # adversarial audit. Starter is the cheapest plan that actually exists for
    # a worker service.
    plan: starter
    envVars:
      - key: CITINEL_ROLE
        value: worker
      - key: CITINEL_SIMULATED_ENDPOINTS_ONLY
        value: "true"
      - key: CITINEL_ANTHROPIC_API_KEY
        sync: false
      - key: CITINEL_TAVILY_API_KEY
        sync: false
      - key: CITINEL_VIRUSTOTAL_API_KEY
        sync: false
      - key: CITINEL_ABUSEIPDB_API_KEY
        sync: false
      - key: CITINEL_DATABASE_URL
        fromDatabase:
          name: citinel-postgres
          property: connectionString
      - key: CITINEL_REDIS_URL
        fromService:
          name: citinel-redis
          type: keyvalue
          property: connectionString

  # --- redis / key value: enrichment cache + hash dedup ---------------------
  - type: keyvalue
    name: citinel-redis
    plan: free
    ipAllowList: []          # reachable only from other Render services

  # --- cron: keep the free web service warm before/through judging ----------
  - type: cron
    name: citinel-keepwarm
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.web
    plan: free
    schedule: "*/10 * * * *"
    dockerCommand: "python -m citinel.deploy.keepwarm"
    envVars:
      - key: CITINEL_WEB_URL
        fromService:
          name: citinel-web
          type: web
          property: host

databases:
  # --- managed postgres: incidents, audit ledger, verdicts ------------------
  - name: citinel-postgres
    plan: free
    databaseName: citinel
    ipAllowList: []          # reachable only from other Render services
