<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="vendor/resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/fonts.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.primitive.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.semantic.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/typography.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/component.css">
<link rel="stylesheet" href="a11y.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="transitions.css">
<script src="reveal.js"></script>
</helmet>
<button onClick="{{ copy }}" title="{{ full }}" style="display:inline-flex;align-items:center;gap:{{ gap }};max-width:100%;min-width:0;padding:{{ pad }};border:1px solid var(--ctn-color-border-strong);border-radius:6px;background:transparent;cursor:pointer;vertical-align:middle;text-align:left">
  <span style="font-family:var(--ctn-font-display);font-size:{{ tagSize }};letter-spacing:0.1em;color:var(--ctn-color-text-secondary);flex:none">{{ source }}</span>
  <span data-reveal style="font-family:var(--ctn-font-mono);font-size:{{ textSize }};letter-spacing:0;color:var(--ctn-color-text-primary);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:{{ nameMax }}">{{ name }}</span>
  <span data-reveal style="font-family:var(--ctn-font-mono);font-size:{{ idSize }};letter-spacing:0;color:var(--ctn-color-text-muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ id }}</span>
  <span style="font-family:var(--ctn-font-display);font-size:{{ metaSize }};letter-spacing:0.09em;color:{{ copyFg }};flex:none;white-space:nowrap">{{ copyLabel }}</span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:44},&quot;source&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SIGMA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;upi_beneficiary_burst&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;id&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9f21c4a8-7b02-4e11-b3d1-0c4471aa2210&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm'|'md'&quot;}}">
class Component extends DCLogic {
  state = {copied:false};
  componentWillUnmount(){ clearTimeout(this.t); }
  renderVals(){
    const p = this.props, sm = (p.size ?? 'md') === 'sm';
    const source = p.source ?? 'SIGMA';
    const name = p.name ?? 'rule';
    const id = p.id ?? '';
    const full = name + '  ' + id;
    return {
      source, name, id, full,
      copy: ()=>{
        try{ navigator.clipboard.writeText(full); }catch(e){}
        this.setState({copied:true});
        clearTimeout(this.t);
        this.t = setTimeout(()=>this.setState({copied:false}), 1400);
      },
      copyLabel: this.state.copied ? 'COPIED' : 'COPY ID',
      copyFg: this.state.copied ? 'var(--ctn-color-text-primary)' : 'var(--ctn-color-text-disabled)',
      gap: sm ? '6px' : '8px',
      pad: sm ? '2px 7px' : '4px 10px',
      tagSize: sm ? '7px' : '8px',
      textSize: sm ? '10.5px' : '12px',
      idSize: sm ? '10px' : '11px',
      metaSize: sm ? '7px' : '7.5px',
      nameMax: sm ? '150px' : '230px'
    };
  }
}
</script>
</body>
</html>
