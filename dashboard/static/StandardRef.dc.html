<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="vendor/resources.js"></script>
<script src="./support.js"></script>
<!-- Render-blocking, deliberately. The same sheets are declared again in the
     helmet block below, which the DC runtime injects into the document head
     with JavaScript AFTER support.js boots -- so until this block existed the
     browser painted the entire document with no CSS at all, on every single
     load. Ordinary navigation hid that behind the browser paint-holding; a
     cross-document view transition does not, because it captures the incoming
     page at its first render opportunity and animates to whatever is there,
     which was an unstyled page (confirmed live on the audit screen, 2 Sep
     2026). The duplicate links cost one cache hit each and nothing else; the
     unstyled frame is now unpaintable. -->
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/fonts.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.primitive.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.semantic.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/typography.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/component.css">
<link rel="stylesheet" href="a11y.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="transitions.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/fonts.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.primitive.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.semantic.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/typography.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/component.css">
<link rel="stylesheet" href="a11y.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="transitions.css">
<script src="reveal.js"></script>
</helmet>
<button onClick="{{ copy }}" title="{{ full }}" style="display:inline-flex;align-items:center;gap:{{ gap }};max-width:100%;min-width:0;padding:{{ pad }};border:1px solid var(--ctn-color-border-strong);border-radius:6px;background:transparent;cursor:pointer;vertical-align:middle;text-align:left">
  <svg width="{{ icon }}" height="{{ icon }}" viewBox="0 0 14 14" style="flex:none;display:block">
    <path d="M 7 1.8 V 8.4 M 4.6 6.2 L 7 8.6 L 9.4 6.2" fill="none" stroke="var(--ctn-color-text-muted)" stroke-width="1.2"></path>
    <path d="M 2.4 10.8 H 11.6" stroke="var(--ctn-color-text-secondary)" stroke-width="1.4"></path>
  </svg>
  <span style="font-family:var(--ctn-font-display);font-size:{{ tagSize }};letter-spacing:0.1em;color:var(--ctn-color-text-secondary);flex:none">{{ standard }}</span>
  <span data-token style="font-family:var(--ctn-font-mono);font-size:{{ textSize }};letter-spacing:0;color:var(--ctn-color-text-primary);flex:none;font-variant-numeric:tabular-nums">{{ version }}</span>
  <span data-reveal style="font-family:var(--ctn-font-mono);font-size:{{ textSize }};letter-spacing:0;color:var(--ctn-color-text-muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ locator }}</span>
  <span style="font-family:var(--ctn-font-display);font-size:{{ metaSize }};letter-spacing:0.09em;color:{{ copyFg }};flex:none;white-space:nowrap">{{ copyLabel }}</span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:44},&quot;standard&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;OCSF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;version&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1.4.0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;locator&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;class 3001 · Authentication&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm'|'md'&quot;}}">
class Component extends DCLogic {
  state = {copied:false};
  componentWillUnmount(){ clearTimeout(this.t); }
  renderVals(){
    const p = this.props, sm = (p.size ?? 'md') === 'sm';
    const standard = p.standard ?? 'OCSF';
    const version = p.version ?? '1.4.0';
    const locator = p.locator ?? '';
    const full = standard + ' ' + version + (locator ? ' / ' + locator : '');
    return {
      standard, version, locator, full,
      copy: ()=>{
        try{ navigator.clipboard.writeText(full); }catch(e){}
        this.setState({copied:true});
        clearTimeout(this.t);
        this.t = setTimeout(()=>this.setState({copied:false}), 1400);
      },
      copyLabel: this.state.copied ? 'COPIED' : 'COPY',
      copyFg: this.state.copied ? 'var(--ctn-color-text-primary)' : 'var(--ctn-color-text-disabled)',
      gap: sm ? '6px' : '8px',
      pad: sm ? '2px 7px' : '4px 10px',
      icon: sm ? 11 : 13,
      tagSize: sm ? '7.5px' : '8.5px',
      textSize: sm ? '10.5px' : '12px',
      metaSize: sm ? '7px' : '7.5px'
    };
  }
}
</script>
</body>
</html>
