<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="vendor/resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/fonts.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.primitive.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.semantic.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/typography.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/spacing.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/component.css">
<link rel="stylesheet" href="a11y.css">
<link rel="stylesheet" href="motion.css">
<script src="reveal.js"></script>
</helmet>
<span style="display:inline-flex;box-sizing:border-box;align-items:center;gap:{{ gap }};max-width:100%;min-width:0;padding:{{ pad }};border:1px dashed var(--ctn-color-border-strong);border-radius:6px;background:transparent;vertical-align:middle">
  <svg width="{{ icon }}" height="{{ icon }}" viewBox="0 0 14 14" style="flex:none;display:block">
    <path d="M 5.5 2.5 H 2.5 V 11.5 H 11.5 V 8.5" fill="none" stroke="var(--ctn-color-text-muted)" stroke-width="1.3"></path>
    <path d="M 7.5 6.5 L 11.5 2.5 M 8.5 2.5 H 11.5 V 5.5" fill="none" stroke="var(--ctn-color-text-secondary)" stroke-width="1.3"></path>
  </svg>
  <span style="font-family:var(--ctn-font-display);font-size:{{ tagSize }};letter-spacing:0.1em;color:var(--ctn-color-text-muted);flex:none">EXT</span>
  <span data-reveal style="font-family:var(--ctn-font-mono);font-size:{{ textSize }};letter-spacing:0;color:var(--ctn-color-text-secondary);flex:none;white-space:nowrap">{{ sourceName }}</span>
  <span data-reveal style="font-family:var(--ctn-font-mono);font-size:{{ textSize }};letter-spacing:0;color:var(--ctn-color-text-muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ host }}</span>
  <span data-reveal style="font-family:var(--ctn-font-mono);font-size:{{ metaSize }};letter-spacing:0;color:var(--ctn-color-text-muted);flex:none;font-variant-numeric:tabular-nums;white-space:nowrap">↑{{ fetchedShort }}</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:48},&quot;source&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;RBI · list of authorised PSPs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;url&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://rbi.org.in/Scripts/PSP_List.aspx&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fetchedAt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-08-23 21:00:12 IST&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm'|'md'&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p = this.props, sm = (p.size ?? 'md') === 'sm';
    const url = p.url ?? 'https://example.org/';
    let host = url;
    try{ const u = new URL(url); host = u.host + (u.pathname !== '/' ? u.pathname : ''); }catch(e){}
    const fetched = p.fetchedAt ?? '';
    return {
      sourceName: p.source ?? 'external source',
      host,
      fetchedShort: fetched.length > 8 ? fetched.slice(11,16) || fetched : fetched,
      gap: sm ? '6px' : '8px',
      pad: sm ? '2px 7px' : '4px 10px',
      icon: sm ? 11 : 13,
      tagSize: sm ? '7.5px' : '8.5px',
      textSize: sm ? '10.5px' : '12px',
      metaSize: sm ? '10px' : '11px'
    };
  }
}
</script>
</body>
</html>
