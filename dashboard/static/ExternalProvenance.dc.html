<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="vendor/resources.js"></script>
<script src="./support.js"></script>
<!-- Render-blocking, deliberately. The same sheets are declared again in the
     helmet block below, which the DC runtime injects into the document head
     with JavaScript AFTER support.js boots -- so until this block existed the
     browser painted the entire document with no CSS at all, on every single
     load. Ordinary navigation hid that behind the browser paint-holding; a
     cross-document view transition does not, because it captures the incoming
     page at its first render opportunity and animates to whatever is there,
     which was an unstyled page (confirmed live on the audit screen, 2 Sep
     2026). The duplicate links cost one cache hit each and nothing else; the
     unstyled frame is now unpaintable. -->
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/fonts.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.primitive.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.semantic.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/typography.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/spacing.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/component.css">
<link rel="stylesheet" href="a11y.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="transitions.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/fonts.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.primitive.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/colors.semantic.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/typography.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/spacing.css">
<link rel="stylesheet" href="_ds/citinel-design-system-fdfd662c-b7a8-446c-963a-2f11a1f91d2a/tokens/component.css">
<link rel="stylesheet" href="a11y.css">
<link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="transitions.css">
<script src="reveal.js"></script>
</helmet>
<div style="box-sizing:border-box;border:1px dashed var(--ctn-color-border-strong);border-radius:6px;padding:11px 13px;min-width:0;background:transparent">
  <div style="display:flex;align-items:center;gap:9px;min-width:0">
    <svg width="13" height="13" viewBox="0 0 14 14" style="flex:none;display:block">
      <path d="M 5.5 2.5 H 2.5 V 11.5 H 11.5 V 8.5" fill="none" stroke="var(--ctn-color-text-muted)" stroke-width="1.3"></path>
      <path d="M 7.5 6.5 L 11.5 2.5 M 8.5 2.5 H 11.5 V 5.5" fill="none" stroke="var(--ctn-color-text-secondary)" stroke-width="1.3"></path>
    </svg>
    <span style="font-family:var(--ctn-font-display);font-size:8.5px;letter-spacing:0.12em;color:var(--ctn-color-text-muted);flex:none">EXTERNAL LOOKUP</span>
    <span data-reveal style="font-family:var(--ctn-font-mono);font-size:10.5px;letter-spacing:0;color:var(--ctn-color-text-muted);flex:none;margin-left:auto;white-space:nowrap">{{ method }} {{ status }}</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;margin-top:9px">
    <div style="display:flex;gap:11px;min-width:0"><span style="font-size:11.5px;color:var(--ctn-color-text-muted);width:76px;flex:none">source</span><span data-token style="font-family:var(--ctn-font-mono);font-size:12px;letter-spacing:0;color:var(--ctn-color-text-primary);flex:1;min-width:0">{{ source }}</span></div>
    <div style="display:flex;gap:11px;min-width:0"><span style="font-size:11.5px;color:var(--ctn-color-text-muted);width:76px;flex:none">retrieved from</span><span data-token style="font-family:var(--ctn-font-mono);font-size:12px;letter-spacing:0;color:var(--ctn-color-text-secondary);flex:1;min-width:0;overflow-wrap:anywhere">{{ url }}</span></div>
    <div style="display:flex;gap:11px;min-width:0"><span style="font-size:11.5px;color:var(--ctn-color-text-muted);width:76px;flex:none">fetched at</span><span data-token style="font-family:var(--ctn-font-mono);font-size:12px;letter-spacing:0;color:var(--ctn-color-text-primary);flex:1;min-width:0;font-variant-numeric:tabular-nums">{{ fetchedAt }}</span></div>
    <div style="display:flex;gap:11px;min-width:0"><span style="font-size:11.5px;color:var(--ctn-color-text-muted);width:76px;flex:none">snapshot</span><span data-token style="font-family:var(--ctn-font-mono);font-size:12px;letter-spacing:0;color:var(--ctn-color-text-secondary);flex:1;min-width:0;overflow-wrap:anywhere">{{ snapshotHash }}</span></div>
  </div>
  <div style="font-size:11.5px;color:var(--ctn-color-text-muted);margin-top:9px;line-height:1.45">{{ note }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:230},&quot;source&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;RBI · list of authorised PSPs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;url&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://rbi.org.in/Scripts/PSP_List.aspx&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fetchedAt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-08-23 21:00:12 IST&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;snapshotHash&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sha256:6d21ab…04f9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;method&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GET&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;200&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p = this.props;
    return {
      source: p.source ?? 'external source',
      url: p.url ?? 'https://example.org/',
      fetchedAt: p.fetchedAt ?? '—',
      snapshotHash: p.snapshotHash ?? 'sha256:—',
      method: p.method ?? 'GET',
      status: p.status ?? '200',
      note: p.note ?? 'the response body was hashed at fetch and pinned. the live source may have changed since; a re-fetch creates a new exhibit rather than replacing this one.'
    };
  }
}
</script>
</body>
</html>
