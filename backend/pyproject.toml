[project]
name = "citinel"
version = "0.1.0"
description = "CITINEL - Autonomous Cyber SOC. Cited evidence, readable policy, regulatory clock."
requires-python = ">=3.11"

# Dependencies are added per build step, not all at once, so that every
# step stays independently runnable. Stage 1 is deliberately offline:
# nothing here reaches the network or requires an API key.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Stage 2: the swarm, the gate, persistence.
swarm = [
    # 1.x: httpx2 HTTP layer, no temperature/top_p/top_k, output_config.
    # The Step 7 code uses 1.x call shapes, so the floor is not optional.
    "anthropic>=1,<2",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
detect = [
    "pysigma>=0.11",
]
# The Swytchcode Python runtime. A subprocess wrapper around the `swy` binary,
# not an HTTP client -- the binary must be installed and the project scaffolded
# with `swy init` for it to reach anything. Optional: without it the seam
# reports not_configured.
swytchcode = [
    "swytchcode-runtime>=1.1.5",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
citinel = "citinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citinel"]

[tool.ruff]
line-length = 100
target-version = "py311"
